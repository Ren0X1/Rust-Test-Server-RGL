// ============================================================
//  SERVIDOR LOCAL DE PRUEBAS DE SKINS  -  server.cfg
//  Se ejecuta solo al arrancar. Edita y reinicia para aplicar.
// ============================================================

// ---------- Identidad ----------
server.hostname "Skin Test Local"
server.description "Servidor local para testear skins"
server.maxplayers 8
server.tickrate 30
server.saveinterval 300

// ---------- MODO CREATIVO (nativo de Rust) ----------
// Construir gratis, colocar donde sea, sin costes de recursos.
creative.allusers true
creative.freebuild true
creative.freeplacement true
creative.freerepair true
creative.unlimitedio true
creative.alwaysonenabled true
creative.bypassholdtoplaceduration true

// ---------- Craft instantaneo ----------
craft.instant true

// ---------- Sin molestias ----------
server.pve false
server.radiation false
server.stability false
server.dropitems false
decay.scale 0
decay.upkeep false

// ---------- Siempre mediodia (para ver bien las skins) ----------
env.time 12
env.progresstime false

// ---------- NPCs y eventos: como un servidor normal ----------
// Los tiempos entre eventos son los de Rust. Se ven con
// events.print_server_events y se cambian con events.set_event_min_delay.
server.events true
ai.think true
ai.move true
bradley.enabled true
cargoship.event_enabled true
halloween.enabled true
xmas.enabled true

// ---------- Antihack desactivado (creativo: noclip, volar, etc.) ----------
// Sin esto te expulsa por "InsideTerrain" al usar noclip o al spawnear.
antihack.enforcementlevel 0
antihack.terrain_protection 0
antihack.terrain_kill false
antihack.admincheat true
