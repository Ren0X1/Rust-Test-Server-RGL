name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de la release (ej: v1.0.0). Vacio = subir el patch solo.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Crear release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determinar la version
        id: ver
        run: |
          set -e
          git fetch --tags --force --quiet

          PEDIDA="${{ inputs.version }}"
          if [ -n "$PEDIDA" ]; then
            TAG="$PEDIDA"
            case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          else
            ULTIMO=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$ULTIMO" ]; then
              TAG="v1.0.0"
            else
              NUM="${ULTIMO#v}"
              MAJOR="${NUM%%.*}"
              RESTO="${NUM#*.}"
              MINOR="${RESTO%%.*}"
              PATCH="${RESTO#*.}"
              PATCH="${PATCH%%[!0-9]*}"
              [ -n "$PATCH" ] || PATCH=0
              TAG="v$MAJOR.$MINOR.$((PATCH + 1))"
              # Si ese tag ya existe (re-run, tag borrado a medias...), seguir subiendo
              while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
                PATCH=$((PATCH + 1))
                TAG="v$MAJOR.$MINOR.$((PATCH + 1))"
              done
            fi
          fi

          echo "Version de esta release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Comprobar que los plugins estan
        run: |
          set -e
          for p in SkinTestMenu CreativeSetup Skins BuildingSkins WorkshopSkinViewer ImageLibrary Godmode Vanish; do
            test -f "server/oxide/plugins/$p.cs" || { echo "::error::Falta el plugin $p.cs"; exit 1; }
          done
          test -f server/server/skintest/cfg/server.cfg || { echo "::error::Falta server.cfg"; exit 1; }
          test -f start.bat || { echo "::error::Falta start.bat"; exit 1; }
          echo "Todo en su sitio."

      - name: Crear el tag
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "El tag $TAG ya existe, lo reutilizo."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Preparar el paquete
        id: pack
        run: |
          set -e
          NAME="Rust-Test-Server-RGL-${{ steps.ver.outputs.tag }}"
          mkdir -p "dist/$NAME"
          cp -r \
            start.bat instalar.bat actualizar_servidor.bat actualizar_oxide.bat \
            README.md comandos_rust_referencia.txt docs server \
            "dist/$NAME/"
          cd dist && zip -qr "../$NAME.zip" "$NAME"
          echo "zip=$NAME.zip" >> "$GITHUB_OUTPUT"

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.pack.outputs.zip }}
          body: |
            ## 🎨 Servidor local de Rust para testear skins

            Paquete listo para usar. **No incluye los binarios del servidor** (~6 GB):
            los descarga `instalar.bat`.

            ### 🚀 Instalacion

            1. Descomprime el zip donde quieras.
            2. Ejecuta **`instalar.bat`** (baja SteamCMD + el servidor + Oxide).
            3. Pon tu SteamID64 en `server\server\skintest\cfg\users.cfg`.
            4. Ejecuta **`start.bat`**.
            5. En Rust pulsa **F1** y escribe `client.connect localhost:28015`.

            ### 📋 Que incluye

            - Modo creativo nativo activado para todo el servidor
            - `/menu` — spawner de items por categorias con iconos
            - `/sk` — skins del item que lleves en la mano
            - `docs/SKINS.md` — las 6266 skins con sus IDs
            - `docs/ITEMS.md` — los 1252 items con shortname e itemid
