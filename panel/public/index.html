<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="panel-token" content="__PANEL_TOKEN__">
  <title>RGL Control</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='7' width='28' height='18' rx='3' fill='%23221f19' stroke='%23cf7a36' stroke-width='2'/%3E%3Ccircle cx='11' cy='16' r='3.2' fill='none' stroke='%23efe5cf' stroke-width='2'/%3E%3Ccircle cx='21' cy='16' r='3.2' fill='none' stroke='%23efe5cf' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <!-- ───────────── barra lateral ───────────── -->
    <aside class="side">
      <div class="brand">
        <svg class="brand-tape" viewBox="0 0 64 40" aria-hidden="true">
          <rect x="1.5" y="1.5" width="61" height="37" rx="5" class="tape-body"/>
          <rect x="10" y="8" width="44" height="15" rx="2" class="tape-window"/>
          <circle cx="22" cy="15.5" r="4.5" class="tape-reel reel-a"/>
          <circle cx="42" cy="15.5" r="4.5" class="tape-reel reel-b"/>
          <path d="M16 38.5 L20 29 H44 L48 38.5" class="tape-foot"/>
        </svg>
        <div>
          <div class="brand-name">RGL<span>/</span>CONTROL</div>
          <div class="brand-sub">rust server</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a href="#panel" data-view="panel"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/></svg><span>Panel</span></a>
        <a href="#mapa" data-view="mapa"><svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5zM9 4v13.5M15 6.5V20"/></svg><span>Mapa</span></a>
        <a href="#servidor" data-view="servidor"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg><span>Servidor</span></a>
        <a href="#permisos" data-view="permisos"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span>Permisos</span></a>
        <a href="#plugins" data-view="plugins"><svg viewBox="0 0 24 24"><path d="M9 3v4M15 3v4M6 7h12v5a6 6 0 0 1-12 0zM12 18v3"/></svg><span>Plugins</span></a>
        <a href="#jugadores" data-view="jugadores"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg><span>Jugadores</span></a>
        <a href="#consola" data-view="consola"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M12 15h5"/></svg><span>Consola</span></a>
      </nav>

      <div class="side-foot">
        <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <button class="theme-toggle" id="themeToggle" type="button" title="Cambiar tema">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <span>Tema</span>
        </button>
      </div>
    </aside>

    <!-- ───────────── contenido ───────────── -->
    <div class="main">
      <header class="top">
        <div class="top-title">
          <div class="kicker" id="viewKicker">resumen</div>
          <h1 id="viewTitle">Panel</h1>
        </div>
        <div class="top-status">
          <span class="pill" id="pillServer"><i class="led"></i><b>—</b></span>
          <span class="pill pill-ghost" id="pillRcon"><i class="led"></i><b>RCON</b></span>
        </div>
        <div class="top-actions">
          <button class="btn btn-ok" data-power="start" type="button">Encender</button>
          <button class="btn" data-power="save" type="button">Guardar</button>
          <button class="btn" data-power="restart" type="button">Reiniciar</button>
          <button class="btn btn-danger" data-power="stop" type="button">Apagar</button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-back" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="btn" id="modalCancel" type="button">Cancelar</button>
        <button class="btn btn-danger" id="modalOk" type="button">Confirmar</button>
      </div>
    </div>
  </div>
  <div class="chart-tip" id="chartTip" hidden></div>

  <script src="/charts.js"></script>
  <script src="/app.js"></script>
</body>
</html>
